<html>

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body {
            font-size: medium;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .joe {
            border: 1px solid #89cefcd4 ;
            background-color:#9bbfeed4;
            color: black;
            max-width: 250px;
            width: 100%;
            border-radius: 20%;
            text-align: center;
            display: inline-block;
        }
        .checkout {
            background-color:rgb(248, 213, 255);
            border: none;
            color:black;
            padding: 15px 32px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
        }
         .checkout:hover {
            background-color: #f59cdf;
            color: black;
        }
         .cart {
            border: 1px solid #9bbfeed4;
            color: black;
            max-width: 250px;
            width: 100%;
            border-radius: 20%;
            text-align: center;
            display: inline-block;
        }
    </style>

</head>

<body>
    <script>
        const Joes = {
            hotdog: 4,
            fries: 3.50,
            soda: 1.50,
            sauerkraut: 1

        };
        //displays hotdog,fries,soda,sauerkraut    
        document.write(Object.keys(Joes));
        //insert line break  between each item in the menu
        document.write("<br>");

        //Output:  Menu: Joe's hotdog $4 - Menu: Joe's fries $3.5 - Menu: Joe's soda $1.5 - Menu: Joe's sauerkraut $1 - 
        for (const key in Joes) { document.write("Menu: Joe's " + key + " $" + Joes[key] + " - "); }
        //1. <select> field in which each item is a menu item name and the options values are the price of the item.  Create this element from the array or object structure you select – DO NOT hard code it.
        document.write("<br>");
        document.write("<select id='menu'>");
        for (const key in Joes) { document.write("<option value='" + Joes[key] + "'>" + key + "</option>"); }
        document.write("</select>");
        //2.	Create a button below the <select> element labelled “Add to Cart”
        document.write("<br>");
        document.write("<button id='addToCart'>Add to Cart</button>");
        //3.	Add a <div> below the button which will define an area for a “Shopping Cart” – ie the list of items added to the cart
        document.write("<br>");
        document.write("<div id='shoppingCart'></div>");
        //4.	Add an additional button below the Shopping Cart labelled “Checkout”
        document.write("<br>");
        document.write("<button id='checkout'>Checkout</button>");
        //part 5. Choose one construct: an associative array, object or class to store quantity of each item ordered.  Initialize all array items with quantity of 0.
        const cart = [];
        cart["hotdog"] = 0;
        cart["fries"] = 0;
        cart["soda"] = 0;
        cart["sauerkraut"] = 0;
        //The user will choose an item from the <select> element and then click the “Add to Cart” button.  Add one to the quantity for the selected item.
        document.getElementById("addToCart").addEventListener("click", function () {
            const selectedItem = document.getElementById("menu").value;
            const selectedItemName = document.getElementById("menu").options[document.getElementById("menu").selectedIndex].text;
            cart[selectedItemName] += 1;
            //Display all items with quantity greater than 0 in the cart area (with the current quantity)
            let cartContent = "Shopping Cart:<br>";
            for (const item in cart) {
                if (cart[item] > 0) {
                    cartContent += item + ": " + cart[item] + "<br>";
                }
            }
            document.getElementById("shoppingCart").innerHTML = cartContent;
        });
        //When the user clicks the “Checkout” button, the final cost of all items should be tallied and a popup (alert) should display the quantity and total cost for each item that was purchased as well as the total for the order.  
        document.getElementById("checkout").addEventListener("click", function () {
            let totalCost = 0;
            let checkoutContent = "Checkout Summary:\n";
            for (const item in cart) {
                if (cart[item] > 0) {
                    const itemCost = cart[item] * Joes[item];
                    totalCost += itemCost;
                    checkoutContent += item + ": " + cart[item] + " x $" + Joes[item] + " = $" + itemCost.toFixed(2) + "\n";
                }
            }
            checkoutContent += "Total Cost: $" + totalCost.toFixed(2);
            alert(checkoutContent);
        });
        //Finally, the cart should be cleared and all quantities returned to 0.
        document.getElementById("checkout").addEventListener("click", function () {
            for (const item in cart) {
                cart[item] = 0;
            }
            document.getElementById("shoppingCart").innerHTML = "Shopping Cart:<br>";
        });

    </script>

</body>


</html>
