<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Joe's Hotdog Stand</title>
    <style>
        /* Page basics */
        body {
            margin: 0;
            padding: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background: linear-gradient(135deg, #f8d5ff, #9bbfee);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Main card container */
        .app {
            background: #ffffff;
            max-width: 400px;
            width: 90%;
            border-radius: 18px;
            padding: 24px 28px 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .app h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #333;
        }

        .app p.subtitle {
            margin-top: 4px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        /* Menu area */
        .menu-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        label {
            font-size: 0.9rem;
            color: #444;
            text-align: left;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #9bbfee;
            font-size: 0.95rem;
            background-color: #f9fbff;
            outline: none;
        }

        select:focus {
            border-color: #f59cdf;
            box-shadow: 0 0 0 2px rgba(245, 156, 223, 0.3);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            margin: 4px;
        }

        .btn-primary {
            background-color: #f59cdf;
            color: #222;
            box-shadow: 0 4px 10px rgba(245, 156, 223, 0.5);
        }

        .btn-primary:hover {
            background-color: #f14fcb;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(241, 79, 203, 0.5);
        }

        .btn-secondary {
            background-color: #9bbfee;
            color: #222;
            box-shadow: 0 4px 10px rgba(155, 191, 238, 0.5);
        }

        .btn-secondary:hover {
            background-color: #6f9ae0;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(111, 154, 224, 0.5);
        }

        /* Cart area */
        .cart {
            margin-top: 16px;
            padding: 14px 12px;
            border-radius: 12px;
            border: 1px solid #e1e7ff;
            background-color: #f9fbff;
            text-align: left;
            font-size: 0.9rem;
            min-height: 60px;
        }

        .cart-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }

        .cart-empty {
            color: #999;
            font-style: italic;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .cart-item span.name {
            font-weight: 500;
        }

        .cart-item span.qty {
            color: #555;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>Joe's Hotdog Stand</h1>
        <p class="subtitle">Build your order and checkout when you're ready.</p>

        <div class="menu-row">
            <label for="menu">Choose an item:</label>
            <select id="menu"></select>
        </div>

        <div>
            <button id="addToCart" class="btn btn-primary">Add to Cart</button>
            <button id="checkout" class="btn btn-secondary">Checkout</button>
        </div>

        <div id="shoppingCart" class="cart">
            <div class="cart-title">Shopping Cart</div>
            <div class="cart-empty">Your cart is empty.</div>
        </div>
    </div>

    <script>
        const Joes = {
            hotdog: 4,
            fries: 3.50,
            soda: 1.50,
            sauerkraut: 1
        };

        // Build the <select> options dynamically
        const menuSelect = document.getElementById('menu');
        for (const key in Joes) {
            const option = document.createElement('option');
            option.value = key; // use the name as value, easier for our cart
            option.textContent = `${key} ($${Joes[key].toFixed(2)})`;
            menuSelect.appendChild(option);
        }

        // Initialize cart as an object instead of array for clarity
        const cart = {
            hotdog: 0,
            fries: 0,
            soda: 0,
            sauerkraut: 0
        };

        const cartDiv = document.getElementById('shoppingCart');

        function renderCart() {
            let hasItems = false;
            let html = `<div class="cart-title">Shopping Cart</div>`;

            for (const item in cart) {
                if (cart[item] > 0) {
                    hasItems = true;
                    html += `
                        <div class="cart-item">
                            <span class="name">${item}</span>
                            <span class="qty">x ${cart[item]}</span>
                        </div>
                    `;
                }
            }

            if (!hasItems) {
                html += `<div class="cart-empty">Your cart is empty.</div>`;
            }

            cartDiv.innerHTML = html;
        }

        document.getElementById("addToCart").addEventListener("click", function () {
            const selectedItemKey = menuSelect.value;
            cart[selectedItemKey] += 1;
            renderCart();
        });

        document.getElementById("checkout").addEventListener("click", function () {
            let totalCost = 0;
            let checkoutContent = "Checkout Summary:\n\n";

            for (const item in cart) {
                if (cart[item] > 0) {
                    const itemCost = cart[item] * Joes[item];
                    totalCost += itemCost;
                    checkoutContent += `${item}: ${cart[item]} x $${Joes[item].toFixed(2)} = $${itemCost.toFixed(2)}\n`;
                }
            }

            if (totalCost === 0) {
                alert("Your cart is empty.");
                return;
            }

            checkoutContent += `\nTotal Cost: $${totalCost.toFixed(2)}`;
            alert(checkoutContent);

            // Clear cart
            for (const item in cart) {
                cart[item] = 0;
            }
            renderCart();
        });

        // Initial render
        renderCart();
    </script>
</body>
</html>
